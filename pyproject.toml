[project]
name = "laya-demo"
version = "0.1.0"
description = "Confidence routing demo: Laya as System 1, Gemini as System 2, with a calibration check"
readme = "README.md"
authors = [
    { name = "Ajblenke", email = "josephblenke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "google-genai>=2.25.0",
    "laya==0.3.10",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
laya-demo = "laya_demo:main"
laya-run = "laya_demo:laya_main"
gemini-run = "laya_demo:gemini_main"
laya-race = "laya_demo:race_main"
laya-report = "laya_demo:report_main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
