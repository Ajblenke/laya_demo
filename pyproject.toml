[project]
name = "laya-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajblenke", email = "josephblenke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "google-genai>=2.25.0",
    "laya==0.3.10",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
laya-demo = "laya_demo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
